name: CI / CD Pipeline & Verification

on:
  push:
    branches: [main, master, staging, develop]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    name: Typecheck, Unit Tests & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: "mysql://mock_user:mock_pass@127.0.0.1:3306/news_db"

      - name: TypeScript Strict Typecheck
        run: npx tsc --noEmit

      - name: Run Unit & Integration Tests
        run: npm test

      - name: Run Production Next.js Build
        run: npm run build
        env:
          DATABASE_URL: "mysql://mock_user:mock_pass@127.0.0.1:3306/news_db"
          JWT_SECRET: "ci_build_verification_secret_key_1234567890_abcdef"
          NEXT_TELEMETRY_DISABLED: 1

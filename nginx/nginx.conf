# =============================================================================
# Global Awaaz — Nginx Reverse Proxy Configuration
# HTTP only — SSL is terminated upstream by Cloudflare
# =============================================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # ─── Logging ──────────────────────────────────────────────────────────────
  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent"';
  access_log /var/log/nginx/access.log main;

  # ─── Performance & Gzip Compression ──────────────────────────────────────
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  types_hash_max_size 2048;

  gzip on;
  gzip_disable "msie6";
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 256;
  gzip_buffers 16 8k;
  gzip_http_version 1.1;
  gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/json
    application/javascript
    application/x-javascript
    application/xml
    application/xml+rss
    application/ld+json
    image/svg+xml
    font/ttf
    font/otf
    font/woff
    font/woff2
    application/vnd.ms-fontobject;

  # ─── Rate Limiting Zones ──────────────────────────────────────────────────
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
  limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;

  # ─── Upstream Backend ─────────────────────────────────────────────────────
  upstream global_awaaz_api {
    server api:5000;
    keepalive 32;
  }

  server {
    listen 80;
    server_name _;

    # ─── Security Headers ─────────────────────────────────────────────────
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ─── Health Check (no rate limit) ─────────────────────────────────────
    location = /health {
      proxy_pass http://global_awaaz_api;
      proxy_set_header Host $host;
    }

    # ─── Static Next.js Bundles & Immutable Assets ────────────────────────
    location /_next/static/ {
      proxy_pass http://global_awaaz_api;
      proxy_set_header Host $host;
      expires 365d;
      add_header Cache-Control "public, max-age=31536000, immutable";
      access_log off;
    }

    # ─── Uploads & Media Files (long-term edge cache) ─────────────────────
    location /uploads/ {
      proxy_pass http://global_awaaz_api;
      proxy_set_header Host $host;
      expires 30d;
      add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400";
      proxy_cache_valid 200 30d;
    }

    # ─── Common Static Assets (Icons, WebP, SVG, Fonts) ───────────────────
    location ~* \.(ico|jpg|jpeg|png|gif|svg|webp|avif|woff|woff2|ttf|eot)$ {
      proxy_pass http://global_awaaz_api;
      proxy_set_header Host $host;
      expires 365d;
      add_header Cache-Control "public, max-age=31536000, immutable";
      access_log off;
    }

    # ─── Auth Routes (strict rate limit) ─────────────────────────────────
    location ~ ^/api/v1/auth/(login|register|forgot-password) {
      limit_req zone=auth_limit burst=5 nodelay;
      proxy_pass http://global_awaaz_api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ─── API Routes (standard rate limit) ─────────────────────────────────
    location /api/ {
      limit_req zone=api_limit burst=60 nodelay;
      proxy_pass http://global_awaaz_api;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 60s;
    }

    # ─── Socket.IO ─────────────────────────────────────────────────────────
    location /socket.io/ {
      proxy_pass http://global_awaaz_api;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_cache_bypass $http_upgrade;
    }
  }
}

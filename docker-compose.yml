version: '3.8'

services:
  # ─── MySQL Database ─────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: global_awaaz_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: GlobalAwaaz@2025
      MYSQL_DATABASE: global_awaaz
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pGlobalAwaaz@2025"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis Cache & Session Store ────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: global_awaaz_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Meilisearch Full-Text Search Engine ─────────────────────────────────────
  meilisearch:
    image: getmeili/meilisearch:v1.6
    container_name: global_awaaz_meilisearch
    restart: always
    environment:
      MEILI_ENV: ${MEILI_ENV:-production}
      MEILI_MASTER_KEY: ${MEILISEARCH_API_KEY:-GlobalAwaaz-MeiliSearch-Master-Key-2025}
    ports:
      - "7700:7700"
    volumes:
      - meili_data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Backend Node.js API Service ─────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: global_awaaz_api
    restart: always
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: "mysql://root:GlobalAwaaz@2025@mysql:3306/global_awaaz"
      REDIS_URL: "redis://redis:6379"
      MEILISEARCH_HOST: "http://meilisearch:7700"
      MEILISEARCH_API_KEY: "GlobalAwaaz-MeiliSearch-Master-Key-2025"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy

volumes:
  mysql_data:
  redis_data:
  meili_data:
